<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Takılmaca — 15 Temel Güdü</title>
  </head>
  <body>
    <main class="layout">
      <div class="stage">
        <canvas id="world"></canvas>
        <aside class="legend">
          <div class="legend-grid">
            <div><span class="dot" style="background: #2f7bff"></span>Erkek</div>
            <div><span class="dot" style="background: #ff6fb5"></span>Kadın</div>
            <div><span class="dot" style="background: #3a3a3a"></span>Kurt</div>
            <div><span class="dot" style="background: #fbfbf6; border: 1px solid #888"></span>Koyun</div>
            <div><span class="dot" style="background: #ff9f43"></span>Balık</div>
            <div><span class="dot" style="background: #5a6326"></span>Ağaç</div>
            <div><span class="dot" style="background: #24501a"></span>Çalı</div>
            <div><span class="dot" style="background: #a8dc6c"></span>Ot</div>
            <div><span class="dot" style="background: #3a8fd6"></span>Gölet / nehir</div>
            <div><span class="dot" style="background: #6f6a2e"></span>Kirli gölet</div>
            <div><span class="dot" style="background: rgba(122, 98, 70, 0.6)"></span>Yamaç</div>
            <div><span class="dot" style="background: #8a8d91"></span>Taş ocağı</div>
            <div><span class="dot" style="background: #3d4552"></span>Çakmaktaşı</div>
            <div><span class="dot" style="background: #b5704a"></span>Kil yatağı</div>
            <div><span class="dot" style="background: #8f8a80"></span>Taş yol</div>
            <div><span class="dot" style="background: #7a5230"></span>Yuva / barınak</div>
            <div><span class="dot" style="background: #ff7a1a"></span>Yanan ocak</div>
          </div>
          <p class="keys">Tekerlek: zoom · Sürükle: kaydır · Tık: seç<br />Boşluk: duraklat · 1-5: hız · F: takip · H: tüm harita</p>
        </aside>
      </div>
      <div id="sidebar" class="sidebar"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
